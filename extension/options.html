<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discord Claude Bridge 設定</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="card">
    <h1>Discord Claude Bridge</h1>
    <p>Chrome 拡張が接続する Bridge の URL を手入力してください。Bridge 側の Action Preset は接続時に読み込みます。</p>
    <label for="bridge-url">Bridge URL</label>
    <input id="bridge-url" type="url" placeholder="http://127.0.0.1:3456" autocomplete="off">
    <div class="actions">
      <button id="save" type="button">保存</button>
      <button id="test" type="button">接続テスト</button>
    </div>
    <p id="status" role="status"></p>
    <p class="note">v1 では LAN 内 Bridge の認証は行いません。利用しないときは Bridge を停止してください。</p>
  </main>
  <script src="options.js"></script>
</body>
</html>
